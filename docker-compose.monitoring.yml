# Run this ON TOP of your existing docker-compose.yml, don't replace it:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --build
#
# Passing both files together makes Compose merge them into ONE project,
# so prometheus/grafana land on the same default network as your
# api-gateway / user-service / order-service containers and can reach
# them by service name.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data: