# Run this ON TOP of your existing docker-compose.yml, don't replace it:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --build
#
# Passing both files together makes Compose merge them into ONE project,
# so the networks declared in docker-compose.yml can be referenced here.
#
#   prometheus -> internal-net   scrapes api-gateway / user-service / order-service by name
#   prometheus -> monitoring-net publishes :9090 (ports aren't published from internal-only networks)
#   grafana    -> monitoring-net reaches prometheus, publishes :3000; no access to app services

networks:
  monitoring-net:
    driver: bridge

  internal-net:
    external: true
    name: go-microservices_internal-net

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - internal-net
      - monitoring-net
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring-net
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data: