# Network topology (see ai_doc/network_issues.md and ai_doc/fixed_network.md)
#
#   public-net   (bridge)          api-gateway                      -> host :8000
#   internal-net (internal: true)  api-gateway, user/order/notification-service
#   db-net       (internal: true)  user/order/notification-service, user-db, order-db, redis, rabbitmq
#   mgmt-net     (bridge)          rabbitmq only                    -> host :15672
#
# Docker does not publish ports for a container attached only to internal
# networks, so rabbitmq needs mgmt-net to expose its management UI. No other
# container joins mgmt-net, so it adds no container-to-container path.

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true
  db-net:
    driver: bridge
    internal: true
  mgmt-net:
    driver: bridge

volumes:
  user_db_data:
  order_db_data:
  redis_data:
  rabbitmq_data:

services:
  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: userdb
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userdb"]
      interval: 3s
      timeout: 3s
      retries: 5

  order-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: orderdb
    volumes:
      - order_db_data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - db-net

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: "my-super-secret-rabbit-cookie-123456"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672" # সিকিউরিটির জন্য শুধুমাত্র localhost-এ দেওয়া হলো
    networks:
      - db-net
      - mgmt-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build: ./user-service
    restart: unless-stopped
    networks:
      - internal-net
      - db-net
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  order-service:
    build: ./order-service
    restart: unless-stopped
    networks:
      - internal-net
      - db-net
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    networks:
      - internal-net
      - db-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - public-net
      - internal-net
    environment:
      - PORT=8000
      - JWT_SECRET=super-secret-key
      - USER_SERVICE_URL=http://user-service:8001
      - ORDER_SERVICE_URL=http://order-service:8002
      - NOTIFICATION_SERVICE_URL=http://notification-service:8003
    depends_on:
      - user-service
      - order-service
      - notification-service
